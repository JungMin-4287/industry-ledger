<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="산업 숫자 장부 — 시장 규모·가격·컨센서스가 언제, 누구 말로, 얼마나 바뀌었는지(읽기 전용 공유본)">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>산업 숫자 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* 장부 레이아웃: 맨 위 요약 줄 → 왼쪽 '수정 기록' 원장, 오른쪽 업종별 상향·하향과 컨센서스 합산. 숫자는 고정폭, 상향=빨강·하향=파랑(국내 시세 관례) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#151a21; --ink-2:#4b5563; --muted:#7f8892; --line:#e2e6ea; --line-2:#cdd3da;
  --accent:#1d5e58; --accent-ink:#ffffff; --accent-wash:#e2eeec;
  --up:#c8323c; --up-wash:#fbe8ea; --down:#2160c4; --down-wash:#e6eefb; --warn:#9a6400; --on-strong:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --font-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,"IBM Plex Sans KR","Malgun Gothic",monospace;
  --font-title:"Nanum Myeongjo","IBM Plex Sans KR","Batang",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --surface:#161a1f; --ink:#edf0f3; --ink-2:#b4bcc6; --muted:#7c8591; --line:#262c33; --line-2:#363e47;
    --accent:#62b7ac; --accent-ink:#0b1513; --accent-wash:#15302c;
    --up:#ff6f6f; --up-wash:#3a1b1d; --down:#6aa6ff; --down-wash:#152439; --warn:#e2a93b; --on-strong:#10131a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --ink:#edf0f3; --ink-2:#b4bcc6; --muted:#7c8591; --line:#262c33; --line-2:#363e47;
  --accent:#62b7ac; --accent-ink:#0b1513; --accent-wash:#15302c;
  --up:#ff6f6f; --up-wash:#3a1b1d; --down:#6aa6ff; --down-wash:#152439; --warn:#e2a93b; --on-strong:#10131a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,28px);padding-block:18px 64px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* 머리 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.brand h1{font-family:var(--font-title);font-weight:800;font-size:clamp(24px,3.2vw,30px);letter-spacing:-.02em;margin:0;line-height:1.15}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{text-decoration:none;padding:7px 12px;border-radius:7px;color:var(--ink-2);font-weight:500}
.tabs a:hover{background:var(--surface)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{margin-left:auto;display:flex;gap:8px;align-items:center}
.search input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;width:min(240px,60vw)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button+button{border-left:1px solid var(--line-2)}

/* 공통 블록 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:10px}
.ph h2{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.ph .hint{color:var(--muted);font-size:12.5px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.empty{color:var(--ink-2);padding:22px 4px;line-height:1.7}
.empty b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
@media (max-width:920px){.grid2{grid-template-columns:minmax(0,1fr)}}
.gridc{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1120px){.gridc{grid-template-columns:minmax(0,1fr)}}
.ctab td,.ctab th{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 16px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .d{font-size:12.5px;color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.up{background:var(--up-wash)} .pill.down{background:var(--down-wash)} .pill.flat{background:var(--bg)}
.pill.strong.up{background:var(--up);color:var(--on-strong)} .pill.strong.down{background:var(--down);color:var(--on-strong)}
.pill.ev{font-size:11.5px;padding:0 6px;margin-left:4px;vertical-align:1px}
.tag.big{border-color:var(--warn);color:var(--warn)}
.evrow{grid-template-columns:118px minmax(0,1fr) auto;gap:4px 14px}
.evrow .pill{white-space:nowrap;justify-self:start;font-size:12px}
.desc{color:var(--muted);font-size:12px;font-weight:400;margin-left:5px}
.evn{display:grid;justify-items:end;gap:1px;text-align:right}
.evn b{font-size:15px;font-weight:600}
.evn small{color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:560px){.evrow{grid-template-columns:104px minmax(0,1fr)}.evn{grid-column:2;justify-items:start;text-align:left}}
.tag{display:inline-block;font-size:11.5px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:5px;padding:0 6px;white-space:nowrap}
.tag.cons{border-color:transparent;background:var(--accent-wash);color:var(--accent)}

/* 묶음 목록: 회사(종목) 또는 품목 구간마다 머리 한 줄 + 신호 줄. 이름 줄에는 이름·기간만, 품목 설명·출처는 아랫줄 회색으로 */
.lede{margin:2px 0 12px;color:var(--ink-2);font-size:13px;max-width:78ch}
.grp{display:grid}
.cog{padding:10px 0 8px;border-top:1px solid var(--line)}
.cog:first-child{border-top:0;padding-top:2px}
/* 넓은 화면에선 묶음을 두 줄로 — 이름과 숫자 사이가 멀어지지 않게 */
.grp.cols{grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));column-gap:36px;align-items:start}
.grp.cols .cog{border-top:0;border-bottom:1px solid var(--line);padding:10px 0 8px}
.cohd{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:0 4px 4px}
.cohd .nm{font-weight:650;font-size:15px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.cohd button.nm{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:650;font-size:15px}
.cohd button.nm:hover{text-decoration:underline;text-underline-offset:3px}
.cohd .what2{color:var(--muted);font-size:12.5px}
.cohd .code{color:var(--muted);font-size:11.5px}
.cohd .cnt{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.sig{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:6px 6px 6px 4px;border-radius:7px;text-decoration:none;color:inherit}
.sig:hover{background:var(--bg)}
.sig>.pill{justify-self:start;font-size:12px;min-width:0}
.sig .lab{min-width:0;font-size:13.5px;line-height:1.45}
.sig .lab b{font-weight:550}
.sig .lab .tag{margin-left:6px;vertical-align:1px}
.sig .meta{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.sig .nv{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;white-space:nowrap}
.sig .nv small{color:var(--muted);font-size:12px}
.sig .nv b{font-size:14.5px;font-weight:600;min-width:62px;text-align:right}
.sig .nv .to{color:var(--ink);font-weight:550;font-size:13px}
.cog .rest{padding:2px 4px 0 106px;color:var(--muted);font-size:12px}
@media (max-width:600px){.sig{grid-template-columns:80px minmax(0,1fr)}.sig .nv{grid-column:2;justify-content:flex-start}.sig .nv b{min-width:0;text-align:left}.cog .rest{padding-left:4px}}
.stat .k{display:flex;gap:10px;font-size:12.5px;margin-top:1px}
.sig.cmt{grid-template-columns:62px minmax(0,1fr) 0}
.sig.cmt .dt{color:var(--muted);font-size:12px;align-self:start;padding-top:2px}
.sig.cmt .txt{font-size:13.5px;color:var(--ink)}
.stat.lead{border-color:var(--line-2)}
.sec{margin-top:16px}
.ph .side{font-size:11.5px;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 6px;margin-right:6px;font-weight:600;vertical-align:2px}
details.bd>summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;cursor:pointer;list-style:none}
details.bd>summary::-webkit-details-marker{display:none}
details.bd>summary::before{content:"▸";color:var(--muted);font-size:12px;width:10px}
details.bd[open]>summary::before{content:"▾"}
details.bd[open]>summary{margin-bottom:10px}
details.bd>summary h2{font-size:15px;margin:0;font-weight:600}
details.bd>summary .hint{color:var(--muted);font-size:12.5px}

/* 수정 기록 */
.feed{display:grid}
.rev{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);text-decoration:none}
.rev:first-child{border-top:0}
.rev:hover{background:var(--bg)}
.rev .what b{font-weight:600}
.rev .meta{color:var(--muted);font-size:12.5px}
.rev .nums{text-align:right;font-size:13px;color:var(--ink-2)}
.rev .nums .to{color:var(--ink);font-weight:500}
@media (max-width:560px){.rev{grid-template-columns:78px minmax(0,1fr)}.rev .nums{grid-column:2;text-align:left}}
.more{margin-top:8px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--up);border-color:var(--up)}
.btn[disabled]{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

/* 업종별 상향·하향 */
.brd{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;font-size:13px}
.brow .nm{min-width:0;overflow-wrap:anywhere}
.brow .nm small{color:var(--muted)}
.dv{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;height:20px}
.dv .l{display:flex;justify-content:flex-end;align-items:center;gap:5px}
.dv .r{display:flex;justify-content:flex-start;align-items:center;gap:5px}
.dv .mid{background:var(--line-2);height:100%}
.dv i{display:block;height:12px;border-radius:3px}
.dv .l i{background:var(--down);border-radius:3px 0 0 3px}
.dv .r i{background:var(--up);border-radius:0 3px 3px 0}
.dv span{font-size:12px;color:var(--ink-2)}

/* 표 */
.tw{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--bg)}
td small{color:var(--muted)}

/* 지표 목록 */
.mgroup{margin-top:18px}
.mgroup>h3{font-size:16px;margin:0 0 6px;font-weight:600}
details.sub{border-top:1px solid var(--line-2)}
details.sub>summary{cursor:pointer;padding:9px 2px;font-weight:500;color:var(--ink-2);list-style-position:inside}
details.sub>summary small{color:var(--muted);font-weight:400}
.mrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 92px 96px;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);text-decoration:none}
.mrow:hover{background:var(--surface)}
.mrow .nm b{font-weight:600}
.mrow .nm small{display:block;color:var(--muted);font-size:12px}
.mrow .lv{font-size:13px}
.mrow .lv small{display:block;color:var(--muted);font-size:11.5px}
.mrow .dt{color:var(--muted);font-size:12px;text-align:right}
@media (max-width:640px){.mrow{grid-template-columns:minmax(0,1fr) auto}.mrow .sp,.mrow .dt{display:none}}

/* 상세 */
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;align-items:flex-start;margin:6px 0 14px}
.dhead h2{font-size:clamp(20px,2.6vw,24px);margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.dhead .tags{display:flex;gap:6px;flex-wrap:wrap}
.dhead p{margin:8px 0 0;color:var(--ink-2);max-width:68ch}
.back{display:inline-block;margin-top:8px;color:var(--ink-2);text-decoration:none;font-size:13px}
.back:hover{color:var(--ink)}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--font-num);font-size:11px;fill:var(--muted)}
.chart .lab{font-family:var(--font-ui);fill:var(--ink-2);font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:2px;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:150px;z-index:5}
.tip .t{color:var(--muted);font-size:12px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cap{color:var(--muted);font-size:12px;margin-top:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select,.form textarea,.cell input,.cell select{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 8px;color:var(--ink);font-size:13.5px;width:100%;min-width:0}
.form .wide{grid-column:1/-1}

/* 자료 넣기 */
.drop{display:grid;gap:10px}
.drop textarea{width:100%;min-height:190px;border:1px solid var(--line-2);border-radius:10px;padding:12px;background:var(--surface);resize:vertical;line-height:1.6}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:88px;height:66px;object-fit:cover;border-radius:6px;border:1px solid var(--line-2)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:20px;height:20px;background:var(--ink);color:var(--bg);cursor:pointer;font-size:12px;line-height:20px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{color:var(--ink-2);font-size:13px}
.cell{min-width:90px}
.cell.w{min-width:200px}
.cell.p{min-width:96px}
.newm{border:1px dashed var(--line-2);border-radius:10px;padding:12px;display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:20;max-width:calc(100vw - 32px)}
.note{background:var(--accent-wash);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px}
.warn{color:var(--warn)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.entry{border-top:1px solid var(--line);padding:12px 2px}
.entry:first-child{border-top:0}
.entry .eh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.entry .eh b{font-weight:600}
.entry .m{color:var(--ink-2);font-size:13px;margin-top:3px}
@media (prefers-reduced-motion:no-preference){.rev,.mrow{transition:background .12s}}
</style>
<script>
window.__LEDGER_STATIC = true; window.__LEDGER_BUILT = "2026-10-10 19:19";

        if (name === 'screens') docs.sort(function(a, b){ return (a.data().asOf < b.data().asOf) ? 1 : -1; });
        cb({docs: docs, size: docs.length, empty: !docs.length}); }); return function(){}; },
      doc: function(){ return {set: no, update: no, delete: no}; } };
  }
  function doc(p){ return { onSnapshot: function(cb){ P.then(function(d){ var v = (d.docs || {})[p]; cb({exists: !!v, data: function(){ return v; }}); }); return function(){}; } }; }
  var dl = { save: function(o){ var b = new Blob([o.data], {type: 'text/csv'}); var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); return Promise.resolve({status: 'saved'}); } };
  window.claude = { use: function(n){ return Promise.resolve(n === 'db' ? {collection: coll, doc: doc} : n === 'user' ? {can: function(){ return Promise.resolve(false); }} : n === 'downloads' ? dl : null); } };
})();
</script>
</head>

<div class="wrap">

    <div class="brand">
      <h1>산업 숫자 장부</h1>
      <p id="stamp">시장 규모·가격·컨센서스가 언제, 누구 말로, 얼마나 바뀌었는지 모아 둔 곳</p>

    <nav class="tabs" aria-label="화면">

    </nav>

</div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
// ───────── 기본 도구
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const localToday = () => { const t = new Date(); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; };
const toMs = d => Date.parse(d + 'T00:00:00Z');
const addDays = (d, n) => new Date(toMs(d) + n*864e5).toISOString().slice(0,10);
const shortDate = d => d ? d.slice(2).replace(/-/g, '.') : '';
const DAY = 864e5;
const GROUP_ORDER = ['반도체','AI 인프라','전자부품·기판','전력·에너지','2차전지·소재','기타','미분류'];
const KINDS = ['시장규모','출하·물량','가격','캐파·가동률','점유율','투자','실적·추정','기타'];
const STS = ['회사','증권사','리서치','컨센서스','언론','정부·통계','실적','기타'];
const PERIOD_RE = /^\d{4}(H[12]|Q[1-4]|-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$/; // 연·반기·분기·월·일(시세)
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

function pKey(p){
  let m;
  if (/^\d{4}$/.test(p)) return +p;
  if ((m = /^(\d{4})H([12])$/.exec(p))) return +m[1] + (m[2]==='2' ? .5 : 0);
  if ((m = /^(\d{4})Q([1-4])$/.exec(p))) return +m[1] + (m[2]-1)/4;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p))) return +m[1] + (m[2]-1)/12 + (m[3]-1)/372;
  if ((m = /^(\d{4})-(\d{2})$/.exec(p))) return +m[1] + (m[2]-1)/12;
  return 0;
}
// 기간을 시간축 위 한 점으로(월은 15일, 분기는 가운데 달)
function pDate(p){
  let m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p))) return Date.UTC(+m[1], m[2]-1, +m[3]);
  if ((m = /^(\d{4})-(\d{2})$/.exec(p))) return Date.UTC(+m[1], m[2]-1, 15);
  if ((m = /^(\d{4})Q([1-4])$/.exec(p))) return Date.UTC(+m[1], (m[2]-1)*3 + 1, 15);
  if ((m = /^(\d{4})H([12])$/.exec(p))) return Date.UTC(+m[1], m[2]==='1' ? 3 : 9, 1);
  if (/^\d{4}$/.test(p)) return Date.UTC(+p, 6, 1);
  return 0;
}
function showP(p){
  let m;
  if ((m = /^(\d{4})H([12])$/.exec(p))) return `${m[2]}H${m[1].slice(2)}`;
  if ((m = /^(\d{4})Q([1-4])$/.exec(p))) return `${m[2]}Q${m[1].slice(2)}`;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(p))) return `${m[1].slice(2)}.${m[2]}.${m[3]}`;
  if ((m = /^(\d{4})-(\d{2})$/.exec(p))) return `${m[1].slice(2)}.${m[2]}`;
  return p;
}
const freqOf = p => /H/.test(p) ? 'H' : /Q/.test(p) ? 'Q' : /^\d{4}-\d{2}-\d{2}$/.test(p) ? 'D' : /-/.test(p) ? 'M' : 'Y';
// 지표의 실적 값만 기간 순으로(같은 기간은 가장 늦게 들어온 값)
// 회사 주요 품목: 지표에 적힌 것 → 종목코드로 info/desc 문서에서
function descOf(m){ if (!m) return ''; if (m.desc) return m.desc; const code = coCode(m); return code ? (S.descByCode[code] || '') : ''; }
const descHtml = m => { const d = descOf(m); return d ? `<span class="desc">${esc(d)}</span>` : ''; };
// 종목(회사 실적·추정) / 품목·산업(가격·수요·시장 규모·월매출·수출). 대만 월매출은 공급망 지표라 품목 쪽
const coCode = m => m.code || (/^co-(\d{6})-/.exec(m.id || '') || [])[1] || '';
const enOf = m => (S.aliasById[m.id] || {}).en || '';
const sideOf = m => m && m.kind === '실적·추정' && m.board !== '대만 월매출' ? 'co' : 'it';
function coOf(m){
  const code = coCode(m);
  const name = (m.entity && m.entity !== '시장' ? m.entity : '') || (code && S.nameByCode[code]) || String(m.name || m.id).split(/\s+/)[0];
  return {key: code || name, name, code, desc: descOf(m)};
}
// 회사 묶음 안에서 보일 짧은 이름: "LG에너지솔루션 분기 영업이익" → "분기 영업이익"
function itemLabel(m, co){ let n = String(m.name || m.id); if (co && n.startsWith(co)) n = n.slice(co.length).trim(); return n || m.item || String(m.name); }
function actualSeries(id){
  const by = new Map();
  for (const p of S.P) if (p.m === id && p.a){ const o = by.get(p.p); if (!o || p.asOf > o.asOf || (p.asOf === o.asOf && p.added >= o.added)) by.set(p.p, p); }
  return [...by.values()].sort((a, b) => pDate(a.p) - pDate(b.p));
}
function fmtNum(v, digits){
  const a = Math.abs(v);
  const d = digits ?? (a >= 100 ? 0 : a >= 10 ? 1 : a >= 1 ? 2 : 3);
  return v.toLocaleString('ko-KR', {maximumFractionDigits: d});
}
function fmtV(v, unit){
  if (v == null || !isFinite(v)) return '–';
  const a = Math.abs(v);
  if (unit === '억원' && a >= 1e4) return fmtNum(v/1e4, 1) + '조원';
  if (unit === '억달러' && a >= 1e4) return fmtNum(v/1e4, 2) + '조달러';
  if (!unit) return fmtNum(v);
  if (unit === '%') return fmtNum(v) + '%';
  return fmtNum(v) + (/^[$₩]/.test(unit) ? ' ' : '') + (/^[가-힣]/.test(unit) ? '' : ' ') + unit;
}
function change(from, to, unit){
  if (unit === '%') return {d: to - from, txt: (to - from >= 0 ? '+' : '') + fmtNum(to - from, 1) + '%p'};
  if (!from) return {d: to - from, txt: '새 값'};
  const c = (to - from) / Math.abs(from) * 100;
  return {d: c, txt: (c >= 0 ? '+' : '') + fmtNum(c, Math.abs(c) >= 100 ? 0 : Math.abs(c) >= 1 ? 1 : 2) + '%'};
}
const dirCls = d => d > 0.0001 ? 'up' : d < -0.0001 ? 'down' : 'flat';
const arrow = d => d > 0.0001 ? '▲' : d < -0.0001 ? '▼' : '–';
function axisScale(unit, maxAbs){
  if (unit === '억원' && maxAbs >= 1e4) return {div: 1e4, unit: '조원'};
  if (unit === '억달러' && maxAbs >= 1e4) return {div: 1e4, unit: '조달러'};
  return {div: 1, unit};
}
function niceTicks(min, max, n = 4){
  if (min === max){ const d = Math.abs(min) * .1 || 1; min -= d; max += d; }
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step/2; v += step) t.push(+v.toPrecision(12));
  return {lo, hi, ticks: t};
}
const uid = () => Math.random().toString(36).slice(2, 8);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }

// ───────── 상태
const S = {
  db: null, noDb: false, canWrite: null, sample: null, dl: null,
  metricDocs: new Map(), entries: new Map(), got: {m: false, e: false},
  M: new Map(), P: [], ser: new Map(), serByM: new Map(), revs: [], cross: [], consNow: null,
  view: 'stocks', detail: null, group: '전체', q: '', win: 30, kind: '전체', mside: 'it',
  evTypeC: '전체', evTypeI: '전체', evNC: 10, evNI: 10, feedNC: 12, feedNI: 12, nameByCode: {}, aliasById: {}, notes: [], notesByM: new Map(), noteNC: 8, noteNI: 8,
  showCons: false, showCross: false, feedN: 60, descByCode: {}, screens: [], gapSector: '전체', gapSort: 'g', gapDir: -1, gapCall: '전체', evType: '전체', evN: 12, events: [], evByM: new Map(), consItem: '영업이익', consYear: null,
  src: {}, editMetric: false, openEntry: null, confirm: null, rawN: 120,
  draft: null, images: [], extracting: null, inText: '', inAsOf: '', inVia: ''
};

function derive(){
  const ents = [...S.entries.values()].sort((a, b) => (a.asOf||'') < (b.asOf||'') ? -1 : (a.asOf||'') > (b.asOf||'') ? 1 : (a.addedAt||'') < (b.addedAt||'') ? -1 : 1);
  const M = new Map();
  for (const e of ents) for (const [id, d] of Object.entries(e.defs || {})) if (d && typeof d === 'object') M.set(id, {...d, id});
  for (const [id, d] of S.metricDocs) M.set(id, {...(M.get(id) || {}), ...d, id, _doc: true});
  const P = [], seen = new Set();
  for (const e of ents) (Array.isArray(e.pts) ? e.pts : []).forEach((p, i) => {
    if (!p || typeof p.v !== 'number' || !isFinite(p.v) || !p.m || !p.p) return;
    // 같은 숫자가 여러 경로(리포트·채널 전달)로 두 번 들어오면 하나만 센다
    const dk = [p.m, p.p, p.src || e.src, p.asOf || e.asOf, p.v, p.a ? 1 : 0].join('|');
    if (seen.has(dk)) return; seen.add(dk);
    const pt = {m: String(p.m), p: String(p.p), v: p.v, a: !!p.a, lo: p.lo, hi: p.hi, n: p.n || '',
      asOf: p.asOf || e.asOf || '', src: p.src || e.src || '출처 미상', st: p.st || e.st || '', via: e.via || '',
      eid: e.id, i, et: e.title || '', added: e.addedAt || '', auto: !!e.auto};
    P.push(pt);
    if (!M.has(pt.m)) M.set(pt.m, {id: pt.m, name: pt.m, group: '미분류', sub: '', unit: '', freq: freqOf(pt.p), kind: '기타'});
  });
  // 지표 문서 없이 자료에만 있는 한국 상장사 실적 지표(co-<코드>-op 등)는 회사 이름을 붙여 준다
  const ITEM = {op: '영업이익', rev: '매출', np: '순이익'};
  for (const m of M.values()){
    const k = /^co-(\d{6})-(op|rev|np)(-q)?$/.exec(m.id);
    if (k && (!m.name || m.name === m.id) && S.nameByCode[k[1]]){
      Object.assign(m, {name: `${S.nameByCode[k[1]]} ${k[3] ? '분기 ' : ''}${ITEM[k[2]]}`, entity: S.nameByCode[k[1]], code: k[1], kind: '실적·추정', item: m.item || ITEM[k[2]], unit: m.unit || '억원'});
    }
    m.group = m.group || '미분류'; m.sub = m.sub || '기타'; m.unit = m.unit || ''; m.kind = m.kind || '기타';
  }
  const ser = new Map();
  for (const pt of P){ if (pt.a) continue; const k = pt.m + '|' + pt.p + '|' + pt.src; let a = ser.get(k); if (!a) ser.set(k, a = []); a.push(pt); }
  const serByM = new Map(), revs = [], cross = [];
  const byMP = new Map();
  for (const [k, arr] of ser){
    arr.sort((a, b) => a.asOf < b.asOf ? -1 : a.asOf > b.asOf ? 1 : a.added < b.added ? -1 : 1);
    const f = arr[0];
    let l = serByM.get(f.m); if (!l) serByM.set(f.m, l = []);
    l.push({key: k, m: f.m, p: f.p, src: f.src, st: f.st, pts: arr, last: arr[arr.length-1]});
    for (let i = 1; i < arr.length; i++){
      const a = arr[i-1], b = arr[i];
      if (a.v === b.v) continue;
      revs.push({m: b.m, p: b.p, src: b.src, st: b.st, from: a.v, to: b.v, fromAsOf: a.asOf, asOf: b.asOf, pt: b});
    }
    const mp = f.m + '|' + f.p; let x = byMP.get(mp); if (!x) byMP.set(mp, x = []); x.push(arr);
  }
  // 다른 출처와 처음 비교(새 출처가 처음 낸 값 vs 그 전 다른 출처의 최신값)
  for (const list of byMP.values()){
    if (list.length < 2) continue;
    for (const arr of list){
      const f = arr[0]; let best = null;
      for (const other of list){ if (other === arr) continue; for (const q of other){ if (q.asOf <= f.asOf && (!best || q.asOf >= best.asOf)) best = q; } }
      if (best && best.v !== f.v) cross.push({m: f.m, p: f.p, src: f.src, st: f.st, from: best.v, to: f.v, fromAsOf: best.asOf, fromSrc: best.src, asOf: f.asOf, pt: f, cross: true});
    }
  }
  // 코멘트: 숫자로 못 담는 업황·회사 이야기(증설 계획, 고객 선확보, 신제품 출하…). 자료의 notes[{m, t}]
  const notes = [];
  for (const e of ents) for (const n of (Array.isArray(e.notes) ? e.notes : [])) {
    if (!n || !n.m || typeof n.t !== 'string' || !n.t.trim()) continue;
    // 숫자 없이 코멘트만 달린 한국 상장사(co-<코드>-op 등)는 회사 이름으로 지표 자리를 만든다
    const k = !M.has(n.m) && /^co-(\d{6})-(op|rev|np)(-q)?$/.exec(n.m);
    if (k){ const nm = S.nameByCode[k[1]] || k[1]; M.set(n.m, {id: n.m, name: `${nm} ${k[3] ? '분기 ' : ''}${ITEM[k[2]]}`, entity: nm, code: k[1], group: '미분류', sub: '기타', unit: '억원', freq: k[3] ? 'Q' : 'Y', kind: '실적·추정', item: ITEM[k[2]]}); }
    notes.push({m: String(n.m), t: n.t.trim(), asOf: n.asOf || e.asOf || '', src: n.src || e.src || '', eid: e.id, url: e.url || ''});
  }
  notes.sort((a, b) => a.asOf < b.asOf ? 1 : a.asOf > b.asOf ? -1 : 0);
  const notesByM = new Map(); for (const n of notes){ let a = notesByM.get(n.m); if (!a) notesByM.set(n.m, a = []); a.push(n); }
  S.notes = notes; S.notesByM = notesByM;
  let consNow = null;
  for (const pt of P) if (pt.st === '컨센서스' && (!consNow || pt.asOf > consNow)) consNow = pt.asOf;
  Object.assign(S, {M, P, ser, serByM, revs, cross, consNow});
  computeEvents();
  if (!S.consYear) S.consYear = String(new Date().getFullYear() + 1);
}
function valAt(arr, d){ let r = null; if (!arr) return r; for (const p of arr){ if (p.asOf <= d) r = p; else break; } return r; }
const passGroup = m => S.group === '전체' || m.group === S.group;
function passQ(m, extra = ''){
  if (!S.q) return true;
  // 품목 설명(ABF·MLB…), 정의, 영어·한자 이름(Unimicron·GCE·欣興)까지 찾는다
  const al = S.aliasById[m.id] || {};
  const hay = [m.name, m.entity, m.sub, m.group, m.code, m.id, descOf(m), m.def, al.en, al.zh, extra].join(' ').toLowerCase();
  return S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

// ───────── 그리기: 머리·필터
function renderTop(){
  const STATIC = !!window.__LEDGER_STATIC;
  const ing = document.querySelector('.tabs [data-tab=ingest]'); if (ing) ing.hidden = STATIC;
  const dm = S.view === 'detail' ? S.M.get(S.detail) : null;
  const cur = dm ? (sideOf(dm) === 'co' ? 'stocks' : 'items') : S.view;
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === cur ? 'page' : 'false'));
  const n = S.P.length, last = S.P.reduce((x, p) => p.asOf > x ? p.asOf : x, '');
  if (S.got.e) $('#stamp').textContent = (STATIC && window.__LEDGER_BUILT ? `공유본 · ${window.__LEDGER_BUILT} 갱신 · ` : '') + (n ? `숫자 ${n.toLocaleString('ko-KR')}개 · 지표 ${S.M.size.toLocaleString('ko-KR')}개 · 출처 ${new Set(S.P.map(p => p.src)).size}곳 · 마지막 자료 ${shortDate(last)}` : '아직 기록된 숫자가 없습니다');
  const groups = GROUP_ORDER.filter(g => [...S.M.values()].some(m => m.group === g));
  for (const m of S.M.values()) if (!groups.includes(m.group)) groups.push(m.group);
  const showBar = ['stocks', 'items', 'metrics', 'log'].includes(S.view);
  if (!showBar){ $('#bar').innerHTML = ''; return; }
  const side = S.view === 'metrics' ? `<div class="seg" role="group" aria-label="구분">${[['it', '품목·산업'], ['co', '종목'], ['all', '전체']].map(([k, l]) => `<button data-act="mside" data-v="${k}" aria-pressed="${S.mside === k}">${l}</button>`).join('')}</div>` : '';
  const wins = S.view === 'stocks' || S.view === 'items' ?`<div class="seg" role="group" aria-label="기간">${[[7,'7일'],[30,'30일'],[90,'90일'],[365,'1년']].map(([d, l]) => `<button data-act="win" data-v="${d}" aria-pressed="${S.win === d}">${l}</button>`).join('')}</div>` : '';
  const kinds = S.view === 'metrics' ? `<select id="kindSel" aria-label="종류" class="chip" style="padding:4px 8px">${['전체', ...KINDS].map(k => `<option ${k === S.kind ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>` : '';
  $('#bar').innerHTML = `<div class="chips" role="group" aria-label="산업">${['전체', ...groups].map(g => `<button class="chip" data-act="group" data-v="${esc(g)}" aria-pressed="${S.group === g}">${esc(g)}</button>`).join('')}</div>
    ${side}${wins}${kinds}
    <div class="search"><input id="q" type="search" placeholder="${S.view === 'stocks' ? '종목·출처 찾기' : S.view === 'items' ? '품목·회사·출처 찾기' : '지표·종목·출처 찾기'}" value="${esc(S.q)}" aria-label="찾기"></div>`;
}

function render(){
  renderTop();
  const main = $('#main');
  if (S.noDb){ main.innerHTML = `<div class="panel empty"><b>저장된 숫자를 불러올 수 없는 화면입니다.</b><br>claude.ai에서 로그인한 채로 이 장부를 열면 기록된 숫자가 나타납니다.</div>`; return; }
  if (!S.got.e || !S.got.m){ main.innerHTML = `<div class="empty">장부를 불러오는 중입니다…</div>`; return; }
  if (S.view === 'stocks') main.innerHTML = vStocks();
  else if (S.view === 'items') main.innerHTML = vItems();
  else if (S.view === 'metrics') main.innerHTML = vMetrics();
  else if (S.view === 'detail') { main.innerHTML = vDetail(); drawDetailCharts(); }
  else if (S.view === 'ingest') main.innerHTML = vIngest();
  else if (S.view === 'log') main.innerHTML = vLog();
  else if (S.view === 'gap'){ main.innerHTML = vGap(); drawGapChart(); }

function breadth(list){

}

function focusOf(m){
  const l = S.serByM.get(m.id) || [];
  if (l.length){
    const want = String(new Date().getFullYear() + 1);
    const c = l.find(s => s.src === '컨센서스' && s.p === want);
    if (c) return c;
    return [...l].sort((a, b) => a.last.asOf < b.last.asOf ? 1 : a.last.asOf > b.last.asOf ? -1 : b.pts.length - a.pts.length || pKey(b.p) - pKey(a.p))[0];
  }
  const acts = S.P.filter(p => p.m === m.id && p.a).sort((a, b) => pKey(a.p) - pKey(b.p));
  return acts.length ? {actual: true, pts: acts, last: acts[acts.length-1], p: acts[acts.length-1].p, src: acts[acts.length-1].src} : null;
}
function metricRow(m, last){

const BOARD_ORDER = ['D램 현물', 'D램 모듈', 'D램 고정가', '낸드', '배터리 소재', '한국 수출', '일본 전자부품 출하', '대만 업종 합계', '대만 월매출', '자료에서 뽑은 가격'];
function boardStats(m){
  const s = actualSeries(m.id); if (!s.length) return null;
  const last = s[s.length-1], t = pDate(last.p), daily = /^\d{4}-\d{2}-\d{2}$/.test(last.p);
  const at = d => { let r = null; for (const x of s){ if (pDate(x.p) <= d) r = x; else break; } return r; };
  const prev = s.length > 1 ? s[s.length-2] : null;
  const mo = daily ? at(t - 30*DAY) : null;
  let yr = at(t - 365*DAY); if (yr && t - pDate(yr.p) > 400*DAY) yr = null;
  return {s, last, prev, mo: mo === last ? null : mo, yr: yr === last ? null : yr, daily};

}

      <div class="tw"><table><thead><tr><th>지표</th><th class="n">최근 값</th><th class="n">기준</th><th class="n">직전 대비</th>${daily ? '<th class="n">1개월 전 대비</th>' : ''}<th class="n">1년 전 대비</th><th>흐름</th></tr></thead><tbody>
      ${rows.map(({m, st}) => `<tr><td><a href="#m-${esc(m.id)}">${esc(m.name)}</a>${(() => { const ev = S.evByM.get(m.id); return ev && ev.asOf >= addDays(localToday(), -30) ? evBadge(ev, true) : ''; })()}<br><small>${esc([descOf(m) || m.sub, m.unit].filter(Boolean).join(' · '))}</small></td>

    f.pts.forEach((p, i) => { const x = X(xs[i]), y = Y(p.v); d += i ? (f.actual ? `L${x},${y}` : `H${x}V${y}`) : `M${x},${y}`; });
    const lx = X(xs[xs.length-1]), ly = Y(vs[vs.length-1]);
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
  });
}

// ───────── 차트
function drawDetailCharts(){
  const m = S.M.get(S.detail); if (!m) return;
  const sel = S.src[m.id];
  const pts = S.P.filter(p => p.m === m.id);
  const allP = [...new Set(pts.map(p => p.p))].sort((a, b) => pKey(a) - pKey(b));
  const color = p => `var(${SERIES[allP.indexOf(p) % SERIES.length]})`;
  const hc = $('#histChart');
  // 월 자료가 13개월 넘게 쌓였으면 증권사 차트처럼 막대(월 값) + 선(전년 대비, 오른쪽 축)
  const hs = hc ? actualSeries(m.id) : [];
  if (hc && hs.length >= 13 && hs.every(p => /^\d{4}-\d{2}$/.test(p.p))) yoyBarChart(hc, hs, m.unit);
  else if (hc){ const s = actualSeries(m.id).slice(-400); if (s.length) lineChart(hc, [{label: m.entity && m.entity !== '시장' ? m.entity : '값', color: 'var(--s1)', pts: s.map(p => ({t: pDate(p.p), v: p.v, d: p.p, n: p.n}))}], m.unit, {step: false, label: showP}); return; }
  // 1) 추정 변화: 선택 출처, 기간마다 선
  const mine = (S.serByM.get(m.id) || []).filter(s => s.src === sel);
  let pick = mine.filter(s => s.pts.length > 1);
  pick = (pick.length ? pick : mine).sort((a, b) => pKey(a.p) - pKey(b.p));
  if (pick.length > 4){
    const multi = pick.filter(s => s.pts.length > 1);
    pick = (multi.length >= 2 ? multi : pick).slice(-4);
  }
  const rc = $('#revChart');
  if (rc){
    if (!pick.length || pick.every(s => s.pts.length < 2)) rc.innerHTML = `<div class="empty" style="padding:10px 0">${esc(sel)}이(가) 같은 기간을 두 번 이상 말한 기록이 아직 없습니다.<br><small style="color:var(--muted)">같은 출처의 새 자료가 들어오면 선이 생깁니다. 다른 출처를 눌러 보세요.</small></div>`;
    else lineChart(rc, pick.map(s => ({label: showP(s.p), color: color(s.p), pts: s.pts.map(p => ({t: toMs(p.asOf), v: p.v, d: p.asOf, n: p.n}))})), m.unit);
  }
  // 2) 기간별 값
  const bars = [];
  for (const p of allP){
    const acts = pts.filter(x => x.p === p && x.a).sort((a, b) => a.asOf < b.asOf ? -1 : 1);
    if (acts.length){ const l = acts[acts.length-1]; bars.push({p, v: l.v, a: true, src: l.src, d: l.asOf}); continue; }
    const es = pts.filter(x => x.p === p && !x.a && x.src === sel).sort((a, b) => a.asOf < b.asOf ? -1 : 1);
    if (es.length){ const l = es[es.length-1]; bars.push({p, v: l.v, a: false, src: l.src, d: l.asOf, lo: l.lo, hi: l.hi}); }
  }
  const pc = $('#perChart');
  if (pc){ if (!bars.length) pc.innerHTML = `<div class="empty" style="padding:10px 0">표시할 값이 없습니다.</div>`; else barChart(pc, bars.slice(-16), m.unit); }
}
// 월 값 막대 + 전년 대비 증가율 선(오른쪽 축). 최근 60개월, 마지막 달은 강조색
function yoyBarChart(el, all, unit){
  const pts = all.slice(-60), byP = new Map(all.map(x => [x.p, x.v]));
  const yoy = pts.map(x => { const [y, mo] = x.p.split('-'); const pv = byP.get(`${+y - 1}-${mo}`); return pv > 0 ? (x.v / pv - 1) * 100 : null; });
  const W = Math.max(300, el.clientWidth || 600), H = 268, mg = {l: 52, r: 48, t: 12, b: 26};
  const vmax = Math.max(...pts.map(x => x.v)), sc = axisScale(unit, vmax), vt = niceTicks(0, vmax / sc.div, 4);
  const yv = yoy.filter(v => v != null), yt = yv.length ? niceTicks(Math.min(0, ...yv), Math.max(0, ...yv), 4) : null;
  const iw = W - mg.l - mg.r, ih = H - mg.t - mg.b, bw = iw / pts.length;
  const X = i => mg.l + bw * (i + .5), Y = v => mg.t + ih - (v / sc.div - vt.lo) / (vt.hi - vt.lo) * ih;
  const Y2 = v => mg.t + ih - (v - yt.lo) / (yt.hi - yt.lo) * ih;
  let g = '';
  for (const t of vt.ticks) g += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${Y(t * sc.div)}" y2="${Y(t * sc.div)}" stroke="var(--line)"/><text x="${mg.l - 6}" y="${Y(t * sc.div) + 3.5}" text-anchor="end">${fmtNum(t)}</text>`;
  if (yt){ for (const t of yt.ticks) g += `<text x="${W - mg.r + 6}" y="${Y2(t) + 3.5}">${fmtNum(t, 0)}%</text>`; g += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${Y2(0)}" y2="${Y2(0)}" stroke="var(--ink-2)" stroke-dasharray="4 3"/>`; }
  const bars = pts.map((x, i) => `<rect x="${(X(i) - bw * .36).toFixed(1)}" width="${(bw * .72).toFixed(1)}" y="${Y(x.v).toFixed(1)}" height="${(Y(0) - Y(x.v)).toFixed(1)}" fill="${i === pts.length - 1 ? 'var(--accent)' : 'var(--line-2)'}" rx="1"/>`).join('');
  let d = '', dots = '';
  yoy.forEach((v, i) => { if (v == null) return; d += `${d && yoy[i - 1] != null ? 'L' : 'M'}${X(i).toFixed(1)},${Y2(v).toFixed(1)}`; dots += `<circle cx="${X(i).toFixed(1)}" cy="${Y2(v).toFixed(1)}" r="${i === pts.length - 1 ? 3.5 : 2.2}" fill="var(--surface)" stroke="var(--s1)" stroke-width="1.6"/>`; });
  const labs = pts.map((x, i) => /-(01|07)$/.test(x.p) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${showP(x.p)}</text>` : '').join('');
  const hit = pts.map((x, i) => `<rect data-i="${i}" x="${(X(i) - bw / 2).toFixed(1)}" width="${bw.toFixed(1)}" y="${mg.t}" height="${ih}" fill="transparent"/>`).join('');
  const last = pts[pts.length - 1], ly = yoy[yoy.length - 1];
  el.innerHTML = `<div class="legend"><span><i style="background:var(--line-2);height:9px;width:12px;border-radius:1px"></i>월 값(${esc(sc.unit)}, 왼쪽)</span><span><i style="background:var(--s1)"></i>전년 대비(%, 오른쪽)</span><span style="margin-left:auto;color:var(--ink)">${esc(showP(last.p))} <b class="num">${esc(fmtV(last.v, unit))}</b>${ly != null ? ` <b class="num ${dirCls(ly)}">${ly >= 0 ? '+' : ''}${fmtNum(ly, 1)}%</b>` : ''}</span></div>
    <svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="월 값과 전년 대비 증가율">${g}${bars}${d ? `<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>` : ''}${dots}${labs}${hit}</svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  svg.querySelectorAll('rect[data-i]').forEach(r => {
    const show = () => { const i = +r.dataset.i, x = pts[i], b = svg.getBoundingClientRect();
      tip.innerHTML = `<div class="t">${esc(showP(x.p))}</div><div class="r"><span>값</span><b class="num">${esc(fmtV(x.v, unit))}</b></div>${yoy[i] != null ? `<div class="r"><span>전년 대비</span><b class="num ${dirCls(yoy[i])}">${yoy[i] >= 0 ? '+' : ''}${fmtNum(yoy[i], 1)}%</b></div>` : ''}`;
      tip.hidden = false; const px = X(i) * b.width / W, tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(b.width - tw, px + 8)) + 'px'; tip.style.top = '28px'; };
    r.addEventListener('pointerenter', show); r.addEventListener('pointerdown', show); r.addEventListener('pointerleave', () => tip.hidden = true);
  });
}
function lineChart(el, series, unit, opt = {}){
  const step = opt.step !== false; // 추정은 계단(다음 수정까지 유지), 실적·시세는 점을 잇는 선
  const W = Math.max(280, el.clientWidth || 560), H = 236, mg = {l: 54, r: 46, t: 10, b: 24};
  const all = series.flatMap(s => s.pts);
  const tMax = step ? Math.max(...all.map(p => p.t), toMs(localToday())) : Math.max(...all.map(p => p.t));
  let t0 = Math.min(...all.map(p => p.t)), t1 = tMax;
  if (t1 - t0 < 45 * DAY) t0 -= 30 * DAY;
  const vs = all.map(p => p.v), sc = axisScale(unit, Math.max(...vs.map(Math.abs)));
  const yt = niceTicks(Math.min(...vs) / sc.div, Math.max(...vs) / sc.div, 4);
  const X = t => mg.l + (t - t0) / (t1 - t0) * (W - mg.l - mg.r), Y = v => mg.t + (1 - (v / sc.div - yt.lo) / (yt.hi - yt.lo)) * (H - mg.t - mg.b);
  const spanD = (t1 - t0) / DAY, xt = [];
  const st = new Date(t0), stepM = spanD <= 150 ? 1 : spanD <= 760 ? 3 : 12;
  let d = new Date(Date.UTC(st.getUTCFullYear(), Math.floor(st.getUTCMonth() / stepM) * stepM + stepM, 1));
  while (d.getTime() <= t1){ xt.push(d.getTime()); d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + stepM, 1)); }
  const xl = t => { const x = new Date(t); return stepM === 12 ? String(x.getUTCFullYear()) : `${String(x.getUTCFullYear()).slice(2)}.${pad2(x.getUTCMonth() + 1)}`; };
  let g = '';
  for (const v of yt.ticks){ const y = Y(v * sc.div); g += `<line x1="${mg.l}" x2="${W - mg.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${mg.l - 8}" y="${y + 3.5}" text-anchor="end">${esc(fmtNum(v))}</text>`; }
  for (const t of xt){ const x = X(t); g += `<text x="${x}" y="${H - 6}" text-anchor="middle">${xl(t)}</text>`; }
  let lines = '', dots = '', ends = [];
  for (const s of series){
    let dd = '';
    s.pts.forEach((p, i) => { const x = X(p.t), y = Y(p.v); dd += i ? (step ? `H${x}V${y}` : `L${x},${y}`) : `M${x},${y}`; });
    const last = s.pts[s.pts.length - 1];
    if (step) dd += `H${X(t1)}`;
    lines += `<path d="${dd}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of (s.pts.length > 40 ? [last] : s.pts)) dots += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    ends.push({y: Y(last.v), label: s.label});
  }
  ends.sort((a, b) => a.y - b.y);
  const clash = ends.some((e, i) => i && e.y - ends[i-1].y < 13);
  const endTxt = clash ? '' : ends.map(e => `<text class="lab" x="${W - mg.r + 6}" y="${e.y + 4}">${esc(e.label)}</text>`).join('');
  el.innerHTML = (series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>` : '') +
    `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="추정 변화 선 그래프">${g}<line x1="${mg.l}" x2="${W - mg.r}" y1="${H - mg.b}" y2="${H - mg.b}" stroke="var(--line-2)"/>${lines}${dots}${endTxt}<line class="xh" x1="0" x2="0" y1="${mg.t}" y2="${H - mg.b}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/><rect class="hit" x="${mg.l}" y="0" width="${W - mg.l - mg.r}" height="${H}" fill="transparent"/></svg>
    <div class="cap">단위 ${esc(sc.unit || '–')} · ${step ? '점은 자료가 나온 날, 선은 다음 수정 전까지 유지된 값' : '점은 발표·집계된 값'}${clash && series.length > 1 ? ' · 선 이름은 위 범례' : ''}</div><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');

${S.images.length ? `(첨부 이미지 ${S.images.length}장: 표·차트 캡처. 숫자를 읽어 같은 규칙으로 넣어라.)` : ''}

답 형식(JSON 하나만):
{"entry":{"asOf":"YYYY-MM-DD","src":"대표 출처","st":"리서치","title":"한 줄 제목","memo":"한두 문장 요약"},
 "newMetrics":[{"id":"mkt-...","name":"...","group":"...","sub":"...","entity":"시장","kind":"시장규모","item":"","unit":"억달러","freq":"Y","def":"정의 한 줄"}],
 "pts":[{"m":"지표 id","p":"2026","v":0,"a":0,"lo":null,"hi":null,"n":"","asOf":"","src":""}],
 "skipped":["뺀 숫자와 이유 한 줄"]}`;
}
function normDraft(j){
  const e = j?.entry || {};
  const draft = {
    entry: {asOf: /^\d{4}-\d{2}-\d{2}$/.test(e.asOf || '') ? e.asOf : (S.inAsOf || localToday()), src: String(e.src || ''), st: STS.includes(e.st) ? e.st : '기타', via: S.inVia || String(e.via || ''), title: String(e.title || ''), memo: String(e.memo || '')},
    newMetrics: (Array.isArray(j?.newMetrics) ? j.newMetrics : []).filter(n => n && n.id && !S.M.has(n.id)).map(n => ({id: String(n.id).toLowerCase().replace(/[^a-z0-9-]/g, '-'), name: String(n.name || n.id), group: String(n.group || '기타'), sub: String(n.sub || ''), entity: String(n.entity || '시장'), kind: KINDS.includes(n.kind) ? n.kind : '기타', item: String(n.item || ''), unit: String(n.unit || ''), freq: ['Y','H','Q','M'].includes(n.freq) ? n.freq : 'Y', def: String(n.def || '')})),
    pts: (Array.isArray(j?.pts) ? j.pts : []).map(p => ({inc: true, m: String(p?.m || ''), p: String(p?.p ?? ''), v: p?.v ?? '', a: !!p?.a, lo: isFinite(p?.lo) && p?.lo !== null ? +p.lo : null, hi: isFinite(p?.hi) && p?.hi !== null ? +p.hi : null, asOf: /^\d{4}-\d{2}-\d{2}$/.test(p?.asOf || '') ? p.asOf : '', src: String(p?.src || ''), n: String(p?.n || '')})),
    skipped: (Array.isArray(j?.skipped) ? j.skipped : []).map(String)
  };
  for (const p of draft.pts) if (p.asOf === draft.entry.asOf) p.asOf = '';
  return draft;
}
async function runExtract(){
  const text = S.inText.trim();
  if (!text && !S.images.length){ toast('붙여 넣은 내용이나 캡처가 없습니다'); return; }
  const ctl = new AbortController(); S.extracting = ctl; render();
  try {
    const opts = {signal: ctl.signal, modelTier: 'default', onText: ({text}) => { const s = $('#xStatus'); if (s) s.textContent = `쓰는 중… ${text.length.toLocaleString('ko-KR')}자`; }};
    if (S.images.length) opts.images = S.images.map(f => f.file);
    const j = await S.sample.json(buildPrompt(text || '(본문 없음, 첨부 이미지만)'), opts);
    S.draft = normDraft(j);
    toast(`숫자 ${S.draft.pts.length}개를 찾았습니다. 확인 후 저장하세요`);
  } catch (e){
    const msg = {cancelled: '', not_granted: 'Claude 사용을 허용하지 않아 추출을 쓸 수 없습니다. 직접 입력은 됩니다.', rate_limited: '요청이 많습니다. 잠시 뒤 다시 눌러 주세요.', invalid_json: '답을 표로 읽지 못했습니다. 다시 눌러 보거나 자료를 나눠 넣어 주세요.', prompt_too_large: '자료가 너무 깁니다. 나눠서 넣어 주세요.', image_rejected: '이 이미지는 읽을 수 없습니다. PNG·JPG로 다시 골라 주세요.', refused: '이 자료는 처리할 수 없다고 합니다. 내용을 줄여 보세요.'}[e?.code] ?? '추출이 중간에 끊겼습니다. 다시 눌러 주세요.';
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') S.sample = null;
    if (msg) toast(msg);
  } finally { S.extracting = null; render(); }
}
async function saveDraft(){
  const d = S.draft; if (!d || !S.db) return;
  const st = $('#saveStatus');
  const rows = d.pts.filter(p => p.inc);
  const bad = rows.find(p => !p.m || !PERIOD_RE.test(p.p) || p.v === '' || !isFinite(+String(p.v).replace(/,/g, '')));
  if (!rows.length){ st.textContent = '저장할 숫자가 없습니다.'; return; }
  if (bad){ st.innerHTML = `<span class="warn">지표·기간(2027, 2026Q3, 2026-09)·값이 빠지거나 틀린 줄이 있습니다.</span>`; return; }
  if (!d.entry.asOf || !d.entry.src){ st.innerHTML = `<span class="warn">자료 날짜와 대표 출처를 채워 주세요.</span>`; return; }
  st.textContent = '저장 중…';
  try {
    const used = new Set(rows.map(p => p.m));
    for (const n of d.newMetrics){
      if (!used.has(n.id) || S.metricDocs.has(n.id)) continue;
      if (!/^[a-z0-9][a-z0-9-]{1,80}$/.test(n.id)) throw {code: 'bad_id', id: n.id};
      await S.db.collection('metrics').doc(n.id).set({...n, createdAt: localToday()});
    }
    const pts = rows.map(p => { const o = {m: p.m, p: p.p, v: +String(p.v).replace(/,/g, '')}; if (p.a) o.a = 1; if (p.lo != null && isFinite(p.lo)) o.lo = +p.lo; if (p.hi != null && isFinite(p.hi)) o.hi = +p.hi; if (p.asOf && p.asOf !== d.entry.asOf) o.asOf = p.asOf; if (p.src && p.src !== d.entry.src) o.src = p.src; if (p.n) o.n = p.n; return o; });
    const id = `e-${d.entry.asOf.replace(/-/g, '')}-${uid()}`;
    await S.db.collection('entries').doc(id).set({...d.entry, pts, addedAt: new Date().toISOString(), by: 'page'});
    S.draft = null; S.inText = ''; S.images = []; S.inAsOf = ''; S.inVia = '';
    toast(`장부에 숫자 ${pts.length}개를 저장했습니다`);
    location.hash = '#log';
  } catch (e){
    st.innerHTML = `<span class="warn">${e?.code === 'bad_id' ? `새 지표 id "${esc(e.id)}"는 영문 소문자·숫자·하이픈만 쓸 수 있습니다.` : e?.code === 'quota_exceeded' ? '장부 저장 공간이 찼습니다. Claude에게 오래된 기록 정리를 부탁하세요.' : '저장하지 못했습니다. 권한이 없거나 연결이 끊겼습니다. 잠시 뒤 다시 눌러 주세요.'}</span>`;
  }
}

// ───────── 기록
function vLog(){
  const list = [...S.entries.values()].filter(e => {
    if (!S.q) return true; const hay = [e.title, e.src, e.via, e.memo].join(' ').toLowerCase(); return S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }).filter(e => S.group === '전체' || (e.pts || []).some(p => S.M.get(p.m)?.group === S.group))
    .sort((a, b) => (a.asOf || '') < (b.asOf || '') ? 1 : (a.asOf || '') > (b.asOf || '') ? -1 : (a.addedAt || '') < (b.addedAt || '') ? 1 : -1);
  const can = S.canWrite !== false;
  if (!list.length) return `<div class="panel empty">들어온 자료가 없습니다.</div>`;
  return `<section class="panel"><div class="ph"><h2>들어온 자료</h2><span class="row"><span class="hint">${list.length}건</span>${S.dl ? `<button class="btn" data-act="csv">전체 숫자 CSV로 받기</button>` : ''}</span></div>
  ${list.map(e => {
    const n = (e.pts || []).length, open = S.openEntry === e.id, key = 'en:' + e.id;
    return `<div class="entry"><div class="eh"><span class="num">${shortDate(e.asOf)}</span><b>${esc(e.title || e.src)}</b><span class="tag ${e.st === '컨센서스' ? 'cons' : ''}">${esc(e.src)}</span><span class="hint" style="color:var(--muted);font-size:12.5px">${esc(e.via || '')} · 숫자 ${n}개 · ${e.by === 'claude' ? 'Claude가 넣음' : '이 화면에서 넣음'}</span></div>
      ${e.memo ? `<div class="m">${esc(e.memo)}</div>` : ''}
      ${/^https:\/\/t\.me\//.test(e.url || '') ? `<div class="m"><a href="${esc(e.url)}" target="_blank" rel="noopener">텔레그램 원문 보기 ↗</a></div>` : ''}
      <div class="row" style="margin-top:6px"><button class="linkbtn" data-act="openEntry" data-v="${esc(e.id)}">${open ? '숫자 닫기' : '숫자 보기'}</button>
      ${can ? (S.confirm === key ? `<span class="confirm">이 자료와 숫자 ${n}개를 지울까요? <button class="btn danger" data-act="delEntry" data-v="${esc(e.id)}">지우기</button><button class="btn" data-act="cancel">취소</button></span>` : `<button class="linkbtn" style="color:var(--muted)" data-act="ask" data-k="${esc(key)}">지우기</button>`) : ''}</div>
      ${open ? `<div class="tw" style="margin-top:8px"><table><thead><tr><th>지표</th><th>기간</th><th class="n">값</th><th>구분</th><th>메모</th></tr></thead><tbody>${(e.pts || []).slice(0, 400).map(p => { const m = S.M.get(p.m) || {name: p.m, unit: ''}; return `<tr><td><a href="#m-${esc(p.m)}">${esc(m.name)}</a>${p.src ? `<br><small>${esc(p.src)}</small>` : ''}</td><td>${esc(showP(String(p.p)))}${p.asOf ? `<br><small>${esc(p.asOf)}</small>` : ''}</td><td class="n num">${esc(fmtV(p.v, m.unit))}</td><td>${p.a ? '실적' : '추정'}</td><td>${esc(p.n || '')}</td></tr>`; }).join('')}</tbody></table></div>` : ''}
    </div>`;
  }).join('')}</section>`;
}
async function exportCsv(){
  const cols = ['자료날짜','대분류','세부','지표','대상','지표id','기간','값','단위','구분','출처','출처종류','받은곳','메모','들어온자료'];
  const q = s => { s = String(s ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [...S.P].sort((a, b) => a.asOf < b.asOf ? -1 : 1).map(p => { const m = S.M.get(p.m) || {}; return [p.asOf, m.group, m.sub, m.name, m.entity, p.m, p.p, p.v, m.unit, p.a ? '실적' : '추정', p.src, p.st, p.via, p.n, p.et].map(q).join(','); });
  try { await S.dl.save({filename: `산업숫자장부_${localToday().replace(/-/g, '')}.csv`, data: '﻿' + cols.join(',') + '\n' + rows.join('\n')}); toast('CSV를 저장했습니다'); }
  catch (e){ if (e?.code !== 'declined') toast('이 화면에서는 파일을 저장할 수 없습니다'); }
}

// ───────── 쓰기
async function delEntry(id){ try { await S.db.collection('entries').doc(id).delete(); S.confirm = null; toast('자료를 지웠습니다'); } catch { toast('지우지 못했습니다. 권한을 확인해 주세요'); } }
async function delPoint(eid, i){
  const e = S.entries.get(eid); if (!e) return;
  const pts = (e.pts || []).filter((_, k) => k !== i);
  try { await S.db.collection('entries').doc(eid).update({pts}); S.confirm = null; toast('숫자 하나를 지웠습니다'); } catch { toast('지우지 못했습니다. 권한을 확인해 주세요'); }
}
async function saveMetric(){
  const m = S.M.get(S.detail); if (!m) return;
  const o = {}; document.querySelectorAll('[data-mf]').forEach(el => o[el.dataset.mf] = el.value.trim());
  try {
    const ref = S.db.collection('metrics').doc(m.id);
    if (S.metricDocs.has(m.id)) await ref.update(o); else await ref.set({...Object.fromEntries(Object.entries(m).filter(([k]) => !k.startsWith('_') && k !== 'id')), ...o, createdAt: localToday()});
    S.editMetric = false; toast('지표 정보를 고쳤습니다');
  } catch { toast('저장하지 못했습니다. 권한을 확인해 주세요'); }
}

// ───────── 이벤트
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (b.tagName === 'INPUT') return; // 체크박스는 change에서
  ev.preventDefault();
  if (a === 'group'){ S.group = v; S.feedN = 60; render(); }
  else if (a === 'win'){ S.win = +v; S.feedN = 60; render(); }
  else if (a === 'feedMore'){ if (b.dataset.k) S[b.dataset.k] += 12; else S.feedN += 80; render(); }
  else if (a === 'evType'){ S[b.dataset.k] = v; S[b.dataset.k === 'evTypeC' ? 'evNC' : 'evNI'] = 10; render(); }
  else if (a === 'q'){ S.q = S.q === v ? '' : v; render(); window.scrollTo(0, 0); }
  else if (a === 'mside'){ S.mside = v; render(); }
  else if (a === 'gapSector'){ S.gapSector = v; render(); }
  else if (a === 'gapCall'){ S.gapCall = v; render(); }
  else if (a === 'gapSort'){ if (S.gapSort === v) S.gapDir *= -1; else { S.gapSort = v; S.gapDir = -1; } render(); }
  else if (a === 'evMore'){ S[b.dataset.k] += 10; render(); }
  else if (a === 'consItem'){ S.consItem = v; render(); }
  else if (a === 'consYear'){ S.consYear = v; render(); }
  else if (a === 'src'){ S.src[S.detail] = v; render(); }
  else if (a === 'editMetric'){ S.editMetric = !S.editMetric; render(); }
  else if (a === 'saveMetric') saveMetric();
  else if (a === 'rawMore'){ S.rawN += 200; render(); }
  else if (a === 'ask'){ S.confirm = b.dataset.k; render(); }
  else if (a === 'cancel'){ S.confirm = null; render(); }
  else if (a === 'delEntry') delEntry(v);
  else if (a === 'delPoint') delPoint(b.dataset.e, +b.dataset.i);
  else if (a === 'openEntry'){ S.openEntry = S.openEntry === v ? null : v; render(); }
  else if (a === 'csv') exportCsv();
  else if (a === 'extract') runExtract();
  else if (a === 'stopX') S.extracting?.abort();
  else if (a === 'manual'){ S.draft = S.draft || {entry: {asOf: S.inAsOf || localToday(), src: '', st: '기타', via: S.inVia, title: '', memo: ''}, newMetrics: [], pts: [], skipped: []}; S.draft.pts.push({inc: true, m: '', p: '', v: '', a: false, lo: null, hi: null, asOf: '', src: '', n: ''}); render(); }
  else if (a === 'addRow'){ S.draft.pts.push({inc: true, m: '', p: '', v: '', a: false, lo: null, hi: null, asOf: '', src: '', n: ''}); render(); }
  else if (a === 'rmRow'){ S.draft.pts.splice(+b.dataset.i, 1); render(); }
  else if (a === 'dropDraft'){ S.draft = null; render(); }
  else if (a === 'saveDraft') saveDraft();
  else if (a === 'rmImg'){ const f = S.images.splice(+b.dataset.i, 1)[0]; if (f) URL.revokeObjectURL(f.url); render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'showCons'){ S.showCons = t.checked; render(); }
  else if (t.dataset.act === 'showCross'){ S.showCross = t.checked; render(); }
  else if (t.id === 'kindSel'){ S.kind = t.value; render(); }
  else if (t.id === 'inImg'){ addImages([...t.files]); }
  else if (t.dataset.pf === 'inc' || t.dataset.pf === 'a'){ S.draft.pts[+t.dataset.i][t.dataset.pf] = t.checked; render(); }
  else if (t.dataset.pf === 'm'){ S.draft.pts[+t.dataset.i].m = t.value; render(); }
  else if (t.dataset.nf){ updNew(t); render(); }
  else if (t.dataset.ef){ S.draft.entry[t.dataset.ef] = t.value; }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q'){ S.q = t.value; clearTimeout(S.qh); S.qh = setTimeout(() => { const pos = t.selectionStart; render(); const q = $('#q'); if (q){ q.focus(); try { q.setSelectionRange(pos, pos); } catch {} } }, 220); }
  else if (t.id === 'inText') S.inText = t.value;
  else if (t.id === 'inAsOf') S.inAsOf = t.value;
  else if (t.id === 'inVia') S.inVia = t.value;
  else if (t.dataset.ef) S.draft.entry[t.dataset.ef] = t.value;
  else if (t.dataset.pf && t.type !== 'checkbox' && t.tagName !== 'SELECT') S.draft.pts[+t.dataset.i][t.dataset.pf] = t.value;
  else if (t.dataset.nf && t.tagName !== 'SELECT') updNew(t);
});
function updNew(t){
  const n = S.draft.newMetrics[+t.dataset.i], k = t.dataset.nf;
  if (k === 'id'){ const old = n.id; n.id = t.value.trim(); for (const p of S.draft.pts) if (p.m === old) p.m = n.id; }
  else n[k] = t.value;
}
document.addEventListener('paste', ev => {
  if (S.view !== 'ingest') return;
  const files = [...(ev.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length){ ev.preventDefault(); addImages(files); }
});
function addImages(files){
  for (const f of files.slice(0, 6 - S.images.length)) if (/^image\/(png|jpeg|webp|gif)$/.test(f.type)) S.images.push({file: f, url: URL.createObjectURL(f)});
  render();
}
function route(){
  const h = location.hash.slice(1);
  S.confirm = null;
  if (h.startsWith('m-')){ if (S.detail !== h.slice(2)) { S.editMetric = false; S.rawN = 120; } S.detail = h.slice(2); S.view = 'detail'; }
  else {
    const v = {changes: 'stocks', board: 'items'}[h] || h; // 예전 주소(#changes·#board)도 열리게
    S.view = ['stocks', 'items', 'metrics', 'gap', 'ingest', 'log'].includes(v) && !(v === 'ingest' && window.__LEDGER_STATIC) ? v : 'stocks';
  }
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'detail') drawDetailCharts(); if (S.view === 'gap') drawGapChart(); }, 150); });

// ───────── 시작
let pending = false;
function schedule(){
  if (pending) return; pending = true;
  setTimeout(() => { // 숨은 탭에서도 그려지도록 requestAnimationFrame 대신
    pending = false; derive();
    // 입력 중인 화면은 다시 그리지 않는다(머리·숫자 줄만 갱신)
    if (S.view === 'ingest' || (S.view === 'detail' && S.editMetric)) renderTop(); else render();
  }, 16);
}
const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
route();
(async () => {
  const [db, user, sample, dl] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);
  S.sample = sample; S.dl = dl;
  if (!db){ S.noDb = true; render(); return; }
  S.db = db;
  const fail = e => { if (e?.code === 'revoked'){ S.noDb = true; render(); } };
  db.collection('metrics').onSnapshot(snap => { S.metricDocs = new Map(snap.docs.map(d => [d.id, d.data()])); S.got.m = true; schedule(); }, fail);
  db.doc('info/desc').onSnapshot(d => { const x = (d.exists && d.data()) || {}; S.descByCode = x.byCode || {}; S.nameByCode = x.nameByCode || {}; S.aliasById = x.aliasById || {}; schedule(); }, fail);
  db.collection('screens').orderBy('asOf', 'desc').limit(3).onSnapshot(snap => { S.screens = snap.docs.map(d => ({...d.data(), id: d.id})); schedule(); }, fail);
  db.collection('entries').onSnapshot(snap => { S.entries = new Map(snap.docs.map(d => [d.id, {...d.data(), id: d.id}])); S.got.e = true; schedule(); }, fail);
  if (user){ try { S.canWrite = await user.can('data.write'); } catch { S.canWrite = null; } }
  if (S.view === 'ingest') render();
})();
})();
